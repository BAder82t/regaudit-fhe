[build-system]
requires = ["setuptools>=70.1,<85", "wheel"]  # bounded: a new major backend is reviewed before it builds a release
build-backend = "setuptools.build_meta"

[project]
name = "regaudit-fhe"
version = "0.1.0"
description = "Depth-tracked regulatory audit primitives with a plaintext model and an optional TenSEAL CKKS backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "VaultBytes Innovations Ltd", email = "b@vaultbytes.com" },
  { name = "Bader Alissaei", email = "b@vaultbytes.com" },
]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering",
  "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
  "numpy>=1.26",
  "cryptography>=50.0.2",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
fhe = [
  "tenseal>=0.3.16",
]
openfhe = [
  "openfhe>=1.1",
]
server = [
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.0",
]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=5",
  "ruff>=0.17.2",
  "mypy>=2.4.0",
  "bandit>=1.7",
  "httpx>=0.27",
  "hypothesis>=6.168.5",
  "psutil>=5",
  "pdoc>=14",
  # build backend for tests/test_installed_distribution.py (builds the sdist and wheel offline)
  "setuptools>=70.1",
  "pyyaml>=6",    # tests/test_release_workflow.py reads the workflow files
]

[project.urls]
Homepage = "https://github.com/BAder82t/regaudit-fhe"
Issues = "https://github.com/BAder82t/regaudit-fhe/issues"

[project.scripts]
regaudit-fhe = "regaudit_fhe.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

# The JSON Schemas are runtime data (every audit validates against them). They live in a plain
# directory inside the package, so they must be listed explicitly or neither the wheel nor the sdist
# contains them. tests/test_installed_distribution.py guards this.
[tool.setuptools.package-data]
regaudit_fhe = ["py.typed", "schemas/*.schema.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, B: bugbear, S: bandit-equivalent,
# UP: pyupgrade, I: isort, SIM: simplify, RUF: ruff-native, A: builtins.
select = ["E", "F", "W", "B", "S", "UP", "I", "SIM", "RUF", "A"]
ignore = [
  "E501",   # line length is enforced by formatter, not lint
  "B008",   # FastAPI Depends(...) defaults are idiomatic
  "SIM108", # ternaries hurt readability for crypto branches
  "S101",   # asserts in src are runtime sanity guards, not auth checks
  "RUF001", # ambiguous unicode (Greek letters) appear in math docstrings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S311", "RUF043"]
"benchmarks/**" = ["S101", "S311"]
"examples/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
files = ["src/regaudit_fhe"]
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q", "--strict-markers", "--strict-config"]
# `valid` is deliberately deprecated but still exercised by the compatibility tests;
# tests that assert the warning use pytest.warns, which overrides this filter.
filterwarnings = [
  "ignore:VerificationOutcome.valid is deprecated:DeprecationWarning",
  "ignore:VerificationResult.valid is deprecated:DeprecationWarning",
  "ignore:verify_receipt\\(\\) without trust material is deprecated:DeprecationWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["regaudit_fhe"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", "examples", ".venv"]
skips = ["B101"]  # assert use is fine in src too (sanity guards)
