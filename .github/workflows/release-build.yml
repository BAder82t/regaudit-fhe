name: release-build

# Reusable workflow: build the distributions ONCE, test the built artefacts (not the checkout),
# audit and inventory them. It never publishes and holds no credentials (read-only token, no id-token).
# Called by publish.yml (real releases) and by release-rehearsal.yml (rehearsals, no publication).

on:
  workflow_call:
    inputs:
      expected_tag:
        description: "Tag the release must carry (strict vX.Y.Z); empty for a rehearsal"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "Package version of the built distributions"
        value: ${{ jobs.build.outputs.version }}
      wheel_sha256:
        description: "SHA-256 of the built wheel"
        value: ${{ jobs.build.outputs.wheel_sha256 }}
      sdist_sha256:
        description: "SHA-256 of the built sdist"
        value: ${{ jobs.build.outputs.sdist_sha256 }}

permissions: {}

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      wheel_sha256: ${{ steps.identity.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.identity.outputs.sdist_sha256 }}
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install the build tools (exact versions)
        run: python -m pip install "build==1.6.1" "twine==7.0.0"
      - name: Build (SOURCE_DATE_EPOCH = commit time)
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build --outdir dist .
          ls -l dist
      - name: Distribution metadata
        run: twine check dist/*
      - name: Version, tag and distribution contents agree
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          if [ -n "$EXPECTED_TAG" ]; then
            python scripts/check_release_metadata.py --dist dist --tag "$EXPECTED_TAG"
          else
            python scripts/check_release_metadata.py --dist dist
          fi
      - name: Record the artefact identities
        id: identity
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz | tee ../SHA256SUMS
          {
            echo "version=$(python -c "import re,sys;print(re.search(r'^version\s*=\s*\"([^\"]+)\"',open('../pyproject.toml').read(),re.M).group(1))")"
            echo "wheel_sha256=$(sha256sum -- *.whl | cut -d' ' -f1)"
            echo "sdist_sha256=$(sha256sum -- *.tar.gz | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: installed-wheel tests (python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # actions/checkout v7 (only for scripts/; the tests come from the sdist)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: repo
      # actions/setup-python v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      # actions/download-artifact v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - name: The downloaded files are the files that were built
        env:
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(sha256sum dist/*.whl | cut -d' ' -f1)" = "$WHEEL_SHA256"
          test "$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" = "$SDIST_SHA256"
      - name: Install the WHEEL into a clean virtualenv (TenSEAL only where a wheel exists)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.12" ]; then extras="dev,server,fhe"; else extras="dev,server"; fi
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls "$PWD"/dist/*.whl)[$extras]"
      - name: Smoke-test the installed wheel from outside any checkout
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          cd "$scratch"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/repo/scripts/smoke_installed_wheel.py" \
            --version "$EXPECTED_VERSION" --forbid-path "$GITHUB_WORKSPACE"
      - name: Run the test suite from the SDIST against the installed wheel
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP/sdist"/*/
          CI=1 "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider --import-mode=importlib -o addopts= -q

  audit:
    name: pip-audit of the installed wheel's environment
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/setup-python v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      # actions/download-artifact v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - name: Audit the environment the wheel installs into
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip "pip-audit==2.10.1"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls "$PWD"/dist/*.whl)[server,fhe]"
          "$RUNNER_TEMP/venv/bin/pip-audit" --strict --vulnerability-service osv

  sbom:
    name: CycloneDX SBOM of the installed wheel's environment
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/setup-python v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      # actions/download-artifact v8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist
      - name: Generate the SBOM
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip "cyclonedx-bom==7.5.0"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$(ls "$PWD"/dist/*.whl)[server,fhe]"
          "$RUNNER_TEMP/venv/bin/cyclonedx-py" environment --output-format JSON --output-file sbom.cdx.json
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
