name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,server,fhe]"
      - run: mypy

  bandit:
    name: bandit (static security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: bandit -r src -c pyproject.toml --severity-level medium

  release-gate:
    name: release-gate (fresh-clone verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: |
          python -m py_compile src/regaudit_fhe/*.py \
                                src/regaudit_fhe/fhe/*.py \
                                tests/*.py
      - run: python -c "import regaudit_fhe; print(regaudit_fhe.__version__)"
      - run: regaudit-fhe --help
      - run: regaudit-fhe schema --list
      - name: tests with the release-gate scope
        # Only [dev] is installed here, so the server and TenSEAL tests cannot run. The scope says exactly
        # which mandatory tests this job requires (see SCOPES in tests/_gate_manifest.py) and never claims the full suite.
        run: pytest -q --gate-scope release-gate --gate-dir test-gate-release-gate

  changes:
    # Decides whether the openfhe job below applies. It takes about 13 minutes, so a pull request that cannot affect it
    # (documentation, the portal, the examples, other workflows) skips it. Every other event always runs it: a push to
    # master, a manual run, anything that is not a pull request. The rule is scripts/openfhe_lane_needed.py, which errs
    # towards running. Untrusted event values go through env, never into the shell text.
    name: changes (does the openfhe job apply?)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      openfhe: ${{ steps.scope.outputs.openfhe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            answer="$(git diff --name-only "$BASE...$HEAD" | python3 scripts/openfhe_lane_needed.py)"
          else
            answer=true
          fi
          echo "openfhe=$answer" >> "$GITHUB_OUTPUT"
          echo "the openfhe job is needed: $answer"

  openfhe:
    # Executes the OpenFHE backend on the one platform its PyPI wheel supports (Linux x86_64, CPython 3.12, glibc
    # 2.38 or newer). The main matrix does not install OpenFHE, so without this job no OpenFHE ciphertext path runs in
    # CI. Running the tests is not a qualification: the ledger and docs/TEST_GATES.md say what they do not cover.
    # The repo's guarded import (_HAVE_OPENFHE) turns an import failure into a silent skip, so this job imports the
    # package on purpose, first, and fails if it cannot, if the module's tests did not all run, or if any skipped.
    # A pull request that changes nothing it could affect skips it (see the changes job).
    name: openfhe (linux x86_64, py3.12)
    needs: changes
    if: needs.changes.outputs.openfhe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: install the pinned OpenFHE wheel, by hash only
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps --no-cache-dir -r scripts/openfhe-requirements.lock
          pip check
      - name: libgomp (the wheel ships libgomp.so without the .so.1 name its extension asks for)
        run: |
          if ldconfig -p | grep -q 'libgomp\.so\.1 '; then
            echo "the system provides libgomp.so.1"
          else
            pkg="$(python -c 'import importlib.util, pathlib; print(pathlib.Path(importlib.util.find_spec("openfhe").origin).resolve().parent)')"
            mkdir -p "$RUNNER_TEMP/libgomp"
            ln -sf "$pkg/lib/libgomp.so" "$RUNNER_TEMP/libgomp/libgomp.so.1"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libgomp${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            echo "linked the wheel's own libgomp.so as libgomp.so.1"
          fi
      - name: the package must import, here and through the repo's own guard
        run: |
          python - <<'PY'
          import importlib.metadata
          import openfhe  # no guard: an ImportError fails the job
          from regaudit_fhe.fhe import openfhe as backend
          version = importlib.metadata.version("openfhe")
          assert version == "1.6.1.0.24.4", version
          assert backend._HAVE_OPENFHE, "the repo's guarded import reports OpenFHE as unavailable"
          print("openfhe", version, "imports; the repo's guard reports it available")
          PY
      - name: tests with the openfhe gate scope
        # Same limits as release-gate (no server extra, no TenSEAL) plus the OpenFHE module, which is optional in
        # the gate, so the next step is what makes it required here.
        run: pytest -q --gate-scope openfhe --gate-dir test-gate-openfhe
      - name: the OpenFHE tests ran, all passed, none skipped
        run: |
          python - <<'PY'
          import json
          ledger = json.load(open("test-gate-openfhe/test-gate-ledger.json"))
          backend = ledger["backends"]["openfhe-ckks"]
          print(backend)
          assert backend["package_installed"] and backend["status"] == "executed", backend
          assert backend["tests_passed"] >= 10, backend
          assert backend["tests_failed"] == 0 and backend["tests_skipped"] == 0, backend
          PY
      - name: test-gate ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: test-gate-ledger-openfhe
          path: test-gate-openfhe/
          if-no-files-found: warn

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Trim macOS to two interpreters to keep CI minutes bounded —
          # full Python matrix runs on Linux.
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.11" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,server,fhe]"
      - name: tests with the test gate
        # --gate adds the ledger and fails the job if a mandatory security test failed, was unexpectedly
        # skipped or is missing (docs/TEST_GATES.md). REGAUDIT_REQUIRE_TENSEAL=1 also forbids any TenSEAL
        # test from skipping. It is set per interpreter, from the wheels PyPI publishes for TenSEAL on
        # these runners (checked 2026-11: 0.3.18 has cp311-cp313 wheels for manylinux x86_64 and macOS
        # arm64; Python 3.10 resolves to 0.3.16, which has cp310 wheels). A new interpreter is not
        # listed here until its wheel is confirmed, so it runs with the requirement off.
        env:
          REGAUDIT_REQUIRE_TENSEAL: ${{ contains(fromJSON('["3.10","3.11","3.12","3.13"]'), matrix.python-version) && '1' || '0' }}
        run: pytest tests/ -q --gate --gate-dir test-gate --cov=regaudit_fhe --cov-report=term-missing --cov-fail-under=80
      - name: test-gate ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: test-gate-ledger-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-gate/
          if-no-files-found: warn

  server-floor:
    # The jobs above install the NEWEST fastapi/pydantic the resolver offers. This one installs exactly the minimums
    # declared in pyproject.toml (read from it, never hard-coded here) and fails if the resolver substitutes anything.
    name: server floors (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python scripts/server_floors.py constraints > "$RUNNER_TEMP/floors.txt"
      - run: pip install -e ".[dev,server,fhe]" -c "$RUNNER_TEMP/floors.txt"
      - run: python scripts/server_floors.py check
      - name: tests with the test gate
        # The ledger is printed in the job log; the tests job uploads it as an artifact.
        env:
          REGAUDIT_REQUIRE_TENSEAL: "1"  # python 3.10 and 3.13 both have TenSEAL wheels (see the tests job)
        run: pytest tests/ -q --gate --gate-dir test-gate

  benchmark:
    name: benchmarks (smoke, py3.12)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,fhe]"
      - run: python benchmarks/bench_fhe.py --rings 14 --reps 1 --flip-trials 5

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install -e ".[dev,server,fhe]"
      - run: pip-audit --strict --vulnerability-service osv

  reproducible-build:
    name: reproducible build (wheel SHA stable)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Pin SOURCE_DATE_EPOCH to last commit timestamp
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: First wheel build
        run: |
          python -m build --wheel --outdir dist1
          (cd dist1 && sha256sum *.whl | sort > ../WHEEL_SHA256.1)
      - name: Second wheel build
        run: |
          python -m build --wheel --outdir dist2
          (cd dist2 && sha256sum *.whl | sort > ../WHEEL_SHA256.2)
      - name: Compare wheel digests
        run: |
          if ! diff -u WHEEL_SHA256.1 WHEEL_SHA256.2; then
            echo "::error::Reproducible-build check failed: wheel digest "\
                 "differs across two builds at the same commit." >&2
            exit 1
          fi
          echo "Wheel-reproducibility check passed:"; cat WHEEL_SHA256.1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: reproducible-build-digests
          path: |
            WHEEL_SHA256.1
            WHEEL_SHA256.2

  sbom:
    name: sbom (cyclonedx)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip cyclonedx-bom
      - run: pip install -e ".[server,fhe]"
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: sbom
          path: sbom.cdx.json
