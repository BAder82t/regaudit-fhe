name: release-rehearsal

# Runs the SAME build-and-test workflow that pypi-release.yml uses, on pull requests that touch packaging or
# release files and on demand. It publishes nothing, signs nothing and holds no credentials: the token is
# read-only, there is no id-token and no environment.

on:
  push:
    branches:
      - "release/**"   # branches only: a tag push never runs this workflow, and nothing here can publish
  pull_request:
    paths:
      - "pyproject.toml"
      - "MANIFEST.in"
      - "src/**"
      - "scripts/**"
      - "tests/test_installed_distribution.py"
      - ".github/workflows/pypi-release.yml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/release-rehearsal.yml"
  workflow_dispatch: {}

permissions: {}

jobs:
  rehearsal:
    name: build and test the distributions (no publication)
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      expected_tag: ""
